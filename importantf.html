<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alpha Transportation Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #2c3e50; }
    p { text-align: center; font-size: 1rem; margin-bottom: 30px; color: #666; }
    .downloads, .upload-form { margin-top: 30px; }
    h2 {
      font-size: 1.5rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .download-list a {
      display: block;
      margin: 10px 0;
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      text-align: center;
      transition: background-color 0.3s;
    }
    .download-list a:hover { background-color: #45a049; }
    .home-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      text-decoration: none;
      color: #2196F3;
      font-weight: bold;
    }
    .home-link:hover { text-decoration: underline; }
    .center-btn { text-align: center; margin-top: 20px; }
    .modal-trigger {
      font-size: 1.2rem;
      padding: 15px 30px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .modal-trigger:hover { background-color: #45a049; }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal-content input,
    .modal-content textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .modal-actions { text-align: right; }
    .send-btn {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-right: 10px;
      cursor: pointer;
    }
    .cancel-btn {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .send-btn:hover, .cancel-btn:hover { opacity: 0.9; }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- EmailJS SDK -->
  <script type="module">
  import emailjs from 'https://cdn.emailjs.com/sdk/4.6.2/email.min.js';

  emailjs.init("n47bnyjjQoxx98rrF");

  // Wait for the DOM to load
  window.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('uploadForm');
    const modal = document.getElementById("uploadModal");

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      emailjs.sendForm('service_9kvl2xv', 'template_bw2ewdg', this)
        .then(function(response) {
          alert('Your document has been sent successfully!');
          modal.style.display = "none";
          document.body.style.overflow = "auto";
          form.reset();
        }, function(error) {
          alert('Failed to send. Please try again.');
          console.error('EmailJS error:', error);
        });
    });
  });
</script>



  <div class="container">
    <h1>Alpha Transportation Portal</h1>
    <p>Welcome to our logistics resource hub. Download key forms or upload your documents securely.</p>

    <!-- Downloads Section -->
    <div class="downloads">
      <h2>Available Downloads</h2>
      <div class="download-list">
        <a href="https://www.dropbox.com/scl/fi/1k8hoxeazv0f7n24n46e8/Driver-Application-2025.pdf?rlkey=y5e6qdu3n00is8qpoezdibu57&st=dhf3k1yc&dl=1" download>
          📄 Driver Application
        </a>
      </div>
    </div>

    <!-- Upload Button -->
    <div class="upload-form">
      <h2>Upload Your Documents</h2>
      <div class="center-btn">
        <button id="openModalBtn" class="modal-trigger">Click here to upload documents</button>
      </div>
    </div>

    <!-- Modal Popup -->
    <div id="uploadModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h3>Upload Documents</h3>

        <!-- FORM FIXED BELOW -->
       <form id="uploadForm" enctype="multipart/form-data">
  <label for="email">Your Email Address:</label>
  <input type="email" id="email" name="user_email" required placeholder="you@example.com" />

  <label for="message">Message:</label>
  <textarea id="message" name="message" rows="4" placeholder="Enter a message..."></textarea>

  <label for="fileUpload">Link to Documents (Google Docs, Dropbox, etc):</label>
  <textarea id="fileLink" name="file_link" rows="1" placeholder="https://docs.google.com/..."></textarea>

  <div class="modal-actions">
    <button type="submit" class="send-btn">Send</button>
    <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
  </div>
</form>
      </div>
    </div>

    <a href="index.html" class="home-link">← Return to Home Page</a>
  </div>

  <!-- Modal and EmailJS Logic -->
  <script>
    const modal = document.getElementById("uploadModal");
    const openBtn = document.getElementById("openModalBtn");
    const closeBtn = document.getElementById("closeModalBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    openBtn.onclick = () => {
      modal.style.display = "block";
      document.body.style.overflow = "hidden";
    };

    closeBtn.onclick = cancelBtn.onclick = () => {
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    };

    window.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
      }
    };

  </script>
</body>
</html>
